<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02060a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%237fe9ff'/%3E%3C/svg%3E">
<title>LUMEN — Deep Drift</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden; background:#01050a;
    touch-action:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage { position:fixed; inset:0; }
  canvas { position:absolute; inset:0; display:block; }
  #gl  { z-index:1; }
  #hud { z-index:2; pointer-events:none; }
  #boot {
    position:fixed; inset:0; z-index:5; display:grid; place-items:center;
    background:#01050a; transition:opacity .6s ease .1s;
    font:300 12px/1.6 -apple-system,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
    letter-spacing:.42em; color:#5c7f90; text-transform:uppercase;
  }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot b { display:block; font-weight:200; font-size:34px; letter-spacing:.34em;
            color:#cfeeff; margin-bottom:14px; text-shadow:0 0 34px rgba(110,215,255,.45); }
  #err {
    position:fixed; inset:0; z-index:9; display:none; padding:40px; overflow:auto;
    background:#0a0206; color:#ffb0c0; font:12px/1.5 ui-monospace,Menlo,monospace;
    white-space:pre-wrap;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <canvas id="hud"></canvas>
</div>
<div id="boot"><div><b>LUMEN</b>descending</div></div>
<pre id="err"></pre>
<script type="module">
  const err = document.getElementById('err');
  const show = (m) => {
    window.__LUMEN_BOOT_ERROR__ = String(m);
    err.style.display = 'block';
    err.textContent += m + '\n\n';
  };
  window.addEventListener('error', (e) => show(e.error?.stack || e.message));
  window.addEventListener('unhandledrejection', (e) => show(e.reason?.stack || e.reason));
  import('./src/main.js').then(m => m.boot()).catch(e => show(e?.stack || e));
</script>
</body>
</html>
